          0.299,0.785,0,1,0,0.607,0,0.554,0.223,0.566,0.291,0.592,0.511,0.605
        inertia: 3
        loitering_time: 0
        objects: car
        friendly_name: Driveway
      street:
        coordinates: 1,0.527,0.293,0.535,0.292,0.582,1,0.574
        loitering_time: 0
        objects: car
        friendly_name: Street
    objects:
      filters:
        car: {}
    motion:
      mask:
        - 0,0.118,0.063,0,0.134,0,0.221,0.096,0.215,0.116,0.233,0.134,0.251,0.132,0.261,0.146,0.242,0.259,0.231,0.343,0.235,0.442,0,0.435
        - 1,0.631,0.78,0.561,0.779,0.538,0.578,0.541,0.446,0.509,0.295,0.511,0.296,0.395,0.318,0.184,0.327,0.124,0.36,0.114,0.363,0.074,0.414,0.061,0.512,0.047,0.614,0.049,0.729,0.067,0.818,0.1,0.877,0.13,0.908,0.15,0.914,0.178,0.958,0.209,0.973,0.274,0.985,0.324,1,0.491
        - 0.001,0.007,0.31,0.01,0.31,0.048,0.253,0.065,0.08,0.062,0.014,0.056
      threshold: 26
      contour_area: 30
    record:
      motion:
        days: 2
 
  amcrest:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/amcrest
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/amcrest_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    live:
      streams:
        Main: amcrest
        Sub: amcrest_sub
    motion:
      mask: 0.279,0.012,0.28,0.053,0.014,0.057,0.017,0.018
 
  amcrest_kitchen:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/amcrest_kitchen
          input_args: preset-rtsp-restream
          roles:
