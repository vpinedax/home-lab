    motion:
      mask: 0.017,0.017,0.294,0.023,0.294,0.074,0.02,0.078
    record:
      motion:
        days: 2
 
classification:
  custom:
    Pets:
      enabled: true
      name: Theo 
      threshold: 0.8
      object_config:
        objects:
          - cat
        classification_type: sub_label
  bird:
    enabled: true
 
semantic_search:
  enabled: false
  model_size: small
 
face_recognition:
  enabled: true
  model_size: small
 
lpr:
  enabled: false
 
version: 0.17-0
