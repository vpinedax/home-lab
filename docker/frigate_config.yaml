mqtt:
  enabled: true
  host: !env_var MQTT_HOST
  port: 1883
  user: !env_var MQTT_USER
  password: !env_var MQTT_PASSWORD
  topic_prefix: frigate
 
detectors:
  ov:
    type: openvino
    device: GPU # Intel iGPU via VAAPI hardware acceleration
 
detect:
  enabled: true
  fps: 5
  width: 640
  height: 480
 
model:
  path: !env_var FRIGATE_MODEL_PATH
  attributes_map:
    person:
      - amazon
      - face
      - fedex
      - ups
      - usps
    car:
      - amazon
      - fedex
      - ups
      - usps
 
go2rtc:
  log:
    format: text
 
  webrtc:
    candidates:
      - http://HOST_IP:8555
      - stun:8555
 
  streams:
    # Reolink Doorbell — HTTP-FLV main + RTSP sub for two-way talk
    doorbell:
      - ffmpeg:http://DOORBELL_IP/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=AM_USER&password=CAM_PASSWORD#video=copy#audio=copy#audio=opus
      - rtsp://CAM_USER:CAM_PASSWORD@DOORBELL_IP/Preview_01_sub
    doorbell_sub:
      - ffmpeg:http://DOORBELL_IP/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user=CAM_USER&password=CAM_PASSWORD
      - rtsp://CAM_USER:CAM_PASSWORD@DOORBELL_IP/Preview_01_sub
 
    # Amcrest front camera
    amcrest:
      - rtsp://CAM_USER:CAM_PASSWORD@AMCREST_IP:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - ffmpeg:amcrest#audio=opus
    amcrest_sub:
      - rtsp://CAM_USER:CAM_PASSWORD@AMCREST_IP:554/cam/realmonitor?channel=1&subtype=1
 
    # Amcrest kitchen camera
    amcrest_kitchen:
      - rtsp://CAM_USER:CAM_PASSWORD@KITCHEN_CAM_IP:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - ffmpeg:amcrest_kitchen#audio=opus
    amcrest_kitchen_sub:
      - rtsp://AM_USER:CAM_PASSWORD@KITCHEN_CAM_IP:554/cam/realmonitor?channel=1&subtype=1
 
ffmpeg:
  hwaccel_args: preset-vaapi
 
birdseye:
  enabled: true
  mode: continuous
  width: 1280
  height: 720
  quality: 8
  restream: false
  layout:
    scaling_factor: 1
 
objects:
  track:
    - person
    - dog
    - cat
    - car
    - amazon
    - fedex
    - usps
    - ups
    - package
    - bird
  filters:
    person:
      min_area: 1500
      max_area: 100000
      threshold: 0.7
 
review:
  alerts:
    labels:
      - cat
      - person
      - dog
      - package
 
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 1
  alerts:
    retain:
      days: 7
      mode: motion
    pre_capture: 2
    post_capture: 10
  detections:
    retain:
      days: 3
      mode: motion
    pre_capture: 2
    post_capture: 5
 
snapshots:
  enabled: true
  retain:
    default: 7
 
cameras:
  doorbell:
    enabled: true
    ffmpeg:
      hwaccel_args: []
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/doorbell
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    live:
      streams:
        Main: doorbell
        Sub: doorbell_sub
    detect:
      stationary:
        interval: 25
        threshold: 50
    review:
      alerts:
        required_zones:
          - front_yard
          - parking_spot
          - driveway
          - street
      detections:
        required_zones:
          - front_yard
          - parking_spot
          - driveway
          - street
    zones:
      front_yard:
        coordinates: 
          0.795,0.622,0.822,0.618,1,0.71,1,1,0,1,0,0.571,0.047,0.575,0.179,0.579,0.319,0.54,0.467,0.541,0.63,0.563,0.714,0.558,0.745,0.563
        inertia: 3
        loitering_time: 0
        friendly_name: Front Yard
        objects:
          - cat
          - dog
          - package
          - person
      parking_spot:
        coordinates: 0.512,0.604,0.52,0.595,0.704,0.594,0.704,0.607
        loitering_time: 0
        friendly_name: Parking Spot
        inertia: 10
      driveway:
