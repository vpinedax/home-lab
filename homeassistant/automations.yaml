- id: '1776757313214'
  alias: Bedroom temperature control
  description: Cool above 73.5, heat below 72, notify to open window if outside is
    cold and dry enough (daytime only)
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: numeric_state
    entity_id: sensor.bedroom_sensor_temperature
    above: 73.5
  - trigger: numeric_state
    entity_id: sensor.bedroom_sensor_temperature
    below: 72
  - trigger: template
    value_template: '{{ state_attr(''weather.nws_home_loc'',
      ''temperature'') | float(0) > 70 }}'
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.bedroom_sensor_temperature
        above: 73.5
      - condition: template
        value_template: '{{ state_attr(''weather.nws_home_loc'',
          ''temperature'') | float(70) < 70 }}'
      - condition: template
        value_template: '{{ state_attr(''weather.nws_home_loc'',
          ''humidity'') | float(100) < 60 }}'
      - condition: time
        after: '10:00:00'
        before: '22:00:00'
      - condition: template
        value_template: "{{ not is_state('device_tracker.7c07126d85c1db28aa2b903fe8cb997b',
          'not_home')\n   or not is_state('device_tracker.26a174979f937d3ad6f1a563909a1f5c',
          'not_home') }}"
      - condition: template
        value_template: '{{ (now() - states(''input_datetime.last_window_notification'')
          | as_datetime | as_local).total_seconds() > 3600 }}'
      sequence:
      - action: notify.my_devices
        data:
          title: "\U0001FA9F Open a window"
          message: 'Bedroom is {{ states(''sensor.bedroom_sensor_temperature'') }}°F
            but it''s {{ state_attr(''weather.nws_home_loc'',
            ''temperature'') }}°F and {{ state_attr(''weather.nws_home_loc'',
            ''humidity'') }}% humidity outside — open a window instead of running
            the AC.

            '
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_window_notification
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: numeric_state
        entity_id: sensor.bedroom_sensor_temperature
        above: 73.5
      - condition: template
        value_template: '{{ state_attr(''weather.nws_home_loc'',
          ''temperature'') | float(0) >= 70 or state_attr(''weather.nws_home_loc'',
          ''humidity'') | float(100) >= 60 }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: cool
    - conditions:
      - condition: numeric_state
        entity_id: sensor.bedroom_sensor_temperature
        below: 73.5
      - condition: state
        entity_id: climate.thermostat
        state: cool
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: 'off'
    - conditions:
      - condition: numeric_state
        entity_id: sensor.bedroom_sensor_temperature
        below: 71.8
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: heat
    - conditions:
      - condition: numeric_state
        entity_id: sensor.bedroom_sensor_temperature
        above: 71.8
      - condition: state
        entity_id: climate.thermostat
        state: heat
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: 'off'
  mode: restart
