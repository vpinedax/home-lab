- id: '1777150057193'
  alias: Fountain Water Low Alert
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id: sensor.dockstream_2_smart_cordless_fountain_remaining_water
    below: number.dockstream_2_smart_cordless_fountain_water_low_threshold
  conditions:
  - condition: template
    value_template: '{{ now() > states(''input_datetime.fountain_silence_until'')
      | as_datetime }}

      '
  actions:
  - action: notify.my_devices
    data:
      title: "\U0001F43E Fountain Water Low"
      message: "Water level is at {{ states('sensor.dockstream_2_smart_cordless_fountain_remaining_water')
        | float(0) | round(2) }} fl. oz (threshold: {{ states('number.dockstream_2_smart_cordless_fountain_water_low_threshold')
        }}) Theo and Jinu are parched!!! \U0001F431\U0001F431\n"
      data:
        actions:
        - action: SILENCE_1H
          title: Silence 1 Hour
        - action: SILENCE_4H
          title: Silence 4 Hours
        - action: SILENCE_24H
          title: Silence 24 Hours
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: SILENCE_1H
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: SILENCE_4H
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: SILENCE_24H
    timeout: '24:00:00'
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''SILENCE_1H'' }}'
      sequence:
      - action: input_datetime.set_datetime
        data:
          entity_id: input_datetime.fountain_silence_until
          datetime: '{{ (now() + timedelta(hours=1)).strftime(''%Y-%m-%d %H:%M:%S'')
            }}'
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''SILENCE_4H'' }}'
      sequence:
      - action: input_datetime.set_datetime
        data:
          entity_id: input_datetime.fountain_silence_until
          datetime: '{{ (now() + timedelta(hours=4)).strftime(''%Y-%m-%d %H:%M:%S'')
            }}'
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''SILENCE_24H'' }}'
      sequence:
      - action: input_datetime.set_datetime
        data:
          entity_id: input_datetime.fountain_silence_until
          datetime: '{{ (now() + timedelta(hours=24)).strftime(''%Y-%m-%d %H:%M:%S'')
            }}'
  mode: single
- id: '1777313067138'
  alias: Notify on New Weather Alert
  description: Sends a notification per NWS alert when count changes from 0
  triggers:
  - entity_id: sensor.nws_alerts_alerts
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.nws_alerts_alerts
    above: 0
  actions:
  - repeat:
      for_each: '{{ state_attr(''sensor.nws_alerts_alerts'', ''Alerts'') }}'
      sequence:
      - data:
          title: ⚠️ {{ repeat.item.Event }}
          message: '{{ repeat.item.Headline }}'
          data:
            url: /dashboard-dashboard/weather
            push:
              sound: default
            actions:
            - action: URI
              title: View Alert
              uri: /dashboard-dashboard/weather
        action: notify.my_devices
